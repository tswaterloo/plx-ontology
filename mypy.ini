# Type checking for the product packages. tools/typecheck.py runs mypy with this file and
# compares the errors to tools/typecheck-baseline.txt: a new error fails that check, a
# listed one is reported, a fixed one asks for its baseline line to be deleted. main_ci
# reports the result without failing the suite.
[mypy]
python_version = 3.12
files = operating, ontology, operator_api
exclude = (^|/)tests/
ignore_missing_imports = True
follow_imports = silent
check_untyped_defs = False
warn_unused_ignores = False
show_error_codes = True
no_error_summary = True
cache_dir = /tmp/plx-mypy-cache

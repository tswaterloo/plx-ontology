y="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start">Lead: a number or name found in text</text><text x="760" y="701" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start">Records are linked, never merged, so each system&#x27;s own value stays visible.</text></svg>
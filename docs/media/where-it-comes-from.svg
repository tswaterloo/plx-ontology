l</text><text x="88" y="140" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start">orders, stock, invoices</text><path d="M366,124 C440,124 440,350.0 492,350.0" stroke="#8A96A3" stroke-width="2" fill="none" marker-end="url(#ah)"/><rect x="32" y="158" width="330" height="48" rx="6" fill="#FFFFFF" stroke="#D9DFE6"/><rect x="32" y="158" width="4" height="48" rx="1" fill="#A9B4C0"/><g transform="translate(48,169) scale(1.0833333333333333)" fill="none" stroke="#6B7785" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 7.5 12 3l8.5 4.5v9L12 21l-8.5-4.5z"/><path d="M3.5 7.5 12 12l8.5-4.5M12 12v9"/></g><text x="88" y="180" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#111827" text-anchor="start">Customer Portal</text><text x="88" y="198" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start">quotes, lots, QC</text><path d="M366,182 C440,182 440,350.0 492,350.0" stroke="#8A96A3" stroke-width="2" fill="none" marker-end="url(#ah)"/><rect x="32" y="216" width="330" height="48" rx="6" fill="#FFFFFF" stroke="#D9DFE6"/><rect x="32" y="216" width="4" height="48" rx="1" fill="#A9B4C0"/><g transform="translate(48,227) scale(1.0833333333333333)" fill="none" stroke="#6B7785" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7.5" ry="2.8"/><path d="M4.5 6v12c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8V6M4.5 12c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8"/></g><text x="88" y="238" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#111827" text-anchor="start">Sage and FileMaker</text><text x="88" y="256" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start">older orders, accounts</text><path d="M36
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1320" height="600" viewBox="0 0 1320 600"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A96A3"/></marker></defs><rect width="1320" height="600" rx="8" fill="#F5F7FA"/><text x="32" y="44" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="650" fill="#111827" text-anchor="start">How an autopilot earns the right to act</text><text x="32" y="70" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="start">It has to prove itself on days it has never seen.</text><rect x="1214.8" y="30" width="18" height="5" rx="1" fill="#4FDCEA"/><text x="1238.8" y="37" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start">You do</text><rect x="1084.0" y="30" width="18" height="5" rx="1" fill="#4DA8FF"/><text x="1108.0" y="37" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start">Workbench does</text><rect x="32" y="100" width="280" height="190" rx="6" fill="#FFFFFF" stroke="#D9DFE6"/><rect x="32" y="100" width="280" height="5" rx="2" fill="#4DA8FF"/><g transform="translate(48,120) scale(1.1666666666666667)" fill="none" stroke="#1F7AE0" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19.5 8.5l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></g><text x="88" y="132" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1F7AE0" text-anchor="start">1</text><text x="104" y="132" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#111827" text-anchor="start">Starts in Draft</text><text x="48" y="164" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4B5563" text-anchor="start">It prepares work. A person accepts,</text><text x="48" y="183" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4B5563" text-anchor="start">edits or rejects every item.</text><path d="M318,138 L364,138" stroke="#8A96A3" stroke-width="2" fill="none" marker-end="url(#ah)"/><rect x="370" y="100" width="560" height="190" rx="6" fill="#FFFFFF" stroke="#D9DFE6"/><rect x="370" y="100" width="560" height="5" rx="2" fill="#4DA8FF"/><g transform="translate(386,120) scale(1.1666666666666667)" fill="none" stroke="#1F7AE0" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3.5 20.5 7 17 10.5"/><path d="M3.5 12V10a3 3 0 0 1 3-3h14M7 20.5 3.5 17 7 13.5"/><path d="M20.5 12v2a3 3 0 0 1-3 3h-14"/></g><text x="426" y="140" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#111827" text-anchor="start">2  Tested on past days</text><text x="386" y="170" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4B5563" text-anchor="start">It replays real days and compares its drafts with what people actually did.</text><rect x="386.0" y="192" width="20" height="34" rx="3" fill="#E3E8EE"/><g transform="translate(387.0,232) scale(0.75)" fill="none" stroke="#6B7785" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8L16.5 9.5"/></g><rect x="410.5" y="192" width="20" height="34" rx="3" fill="#E3E8EE"/><g transform="translate(411.5,232) scale(0.75)" fill="none" stroke="#6B7785" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8L16.5 9.5"/></g><rect x="435.0" y="192" width="20" height="34" rx="3" fill="#E3E8EE"/><g transform="translate(436.0,232) scale(0.75)" fill="none" stroke="#6B7785" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8L16.5 9.5"/></g><rect x="459.5" y="192" width="20" height="34" rx="3" fill="#E3E8EE"/><g transform="translate(460.5,232) scale(0.75)" fill="none" stroke="#6B7785" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/></g><rect x="484.0" y="192" width="20" height="34" rx="3" fill="#E3E8EE"/><g transform="translate(485.0,232) scale(0.75)" fill="none" stroke="#6B7785" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8L16.5 9.5"/></g><rect x="508.5" y="192" width="20" height="34" rx="3" fill="#E3E8EE"/><g transform="translate(509.5,232) scale(0.75)" fill="none" stroke="#6B7785" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8L16.5 9.5"/></g><rect x="533.0" y="192" width="20" height="34" rx="3" fill="#E3E8EE"/><g transform="translate(534.0,232) scale(0.75)" fill="none" stroke="#6B7785" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8L16.5 9.5"/></g><rect x="557.5" y="192" width="20" height="34" rx="3" fill="#4DA8FF"/><g transform="translate(558.5,232) scale(0.75)" fill="none" stroke="#1F7AE0" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8L16.5 9.5"/></g><rect x="582.0" y="192" width="20" height="34" rx="3" fill="#4DA8FF"/><g transform="translate(583.0,232) scale(0.75)" fill="none" stroke="#1F7AE0" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8L16.5 9.5"/></g><rect x="606.5" y="192" width="20" height="34" rx="3" fill="#4DA8FF"/><g transform="translate(607.5,232) scale(0.75)" fill="none" stroke="#1F
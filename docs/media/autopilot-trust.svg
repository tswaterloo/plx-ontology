e-width="2.00" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8L16.5 9.5"/></g><rect x="802.5" y="192" width="20" height="34" rx="3" fill="#4DA8FF"/><g transform="translate(803.5,232) scale(0.75)" fill="none" stroke="#1F7AE0" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8L16.5 9.5"/></g><rect x="827.0" y="192" width="20" height="34" rx="3" fill="#4DA8FF"/><g transform="translate(828.0,232) scale(0.75)" fill="none" stroke="#C2410C" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/></g><rect x="851.5" y="192" width="20" height="34" rx="3" fill="#4DA8FF"/><g transform="translate(852.5,232) scale(0.75)" fill="none" stroke="#1F7AE0" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8L16.5 9.5"/></g><rect x="876.0" y="192" width="20" height="34" rx="3" fill="#4DA8FF"/><g transform="translate(877.0,232) scale(0.75)" fill="none" stroke="#1F7AE0" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8L16.5 9.5"/></g><rect x="900.5" y="192" width="20" height="34" rx="3" fill="#4DA8FF"/><g transform="translate(901.5,232) scale(0.75)" fill="none" stroke="#1F7AE0" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8L16.5 9.5"/></g><text x="386" y="276" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start">Days it learned from</text><text x="557.5" y="276" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1F7AE0" text-anchor="start">Fresh days it never saw while being built: these count</text><path d="M936,138 L982,138" stroke="#8A96A3" stroke-width="2" fill="none" marker-end="url(#ah)"/><rect x="988" y="100" width="300" height="190" rx="6" fill="#FFFFFF" stroke="#D9DFE6"/><rect x="988" y="100" width="300" height="5" rx="2" fill="#4DA8FF"/><g transform="translate(1004,120) scale(1.1666666666666667)" fill="none" stroke="#1F7AE0" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V4M4 20h16"/><path d="M8 16v-4M12 16V8M16 16v-6"/></g><text x="1044" y="140" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#111827" text-anchor="start">3  Must clear the bar</text><text x="1004" y="174" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#111827" text-anchor="start">At least 15 items judged</text><text x="1004" y="198" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#111827" text-anchor="start">At least 90% right</text><rect x="1004" y="224" width="268" height="16" rx="3" fill="#E3E8EE"/><rect x="1004" y="224" width="252" height="16" rx="3" fill="#4DA8FF"/><path d="M1245,218 V246" stroke="#111827" stroke-width="2"/><text x="1245.2" y="262" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#111827" text-anchor="middle">90%</text><text x="1004" y="262" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F7AE0" text-anchor="start">94% on 17 items</text><path d="M1138,294 L1138,330 L172,330 L172,354" stroke="#8A96A3" stroke-width="2" fill="none" marker-end="url(#ah)"/><rect x="32" y="360" width="280" height="180" rx="6" fill="#FFFFFF" stroke="#D9DFE6"/><rect x="32" y="360" width="280" height="5" rx="2" fill="#4DA8FF"/><g transform="translate(48,380) scale(1.1666666666666667)" fill="none" stroke="#1F7AE0" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></g><text x="88" y="392" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1F7AE0" text-anchor="start">4</text><text x="104" y="392" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#111827" text-anchor="start">The owner is told once</text><text x="48" y="424" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4B5563" text-anchor="start">One message when a workflow passes.</text><text x="48" y="443" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4B5563" text-anchor="start">Nothing changes until someone</text><text x="48" y="462" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4B5563" text-anchor="start">switches it on.</text><path d="M318,398 L364,398" stroke="#8A96A3" stroke-width="2" fill="none" marker-end="url(#ah)"/><rect x="370" y="360" width="280" height="180" rx="6" fill="#FFFFFF" stroke="#D9DFE6"/><rect x="370" y="360" width="280" height="5" rx="2" fill="#4FDCEA"/><g transform="translate(386,380) scale(1.1666666666666667)" fill="none" stroke="#0E9AAB" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="7" width="19" height="10" rx="5"/><circle cx="16.5" cy="12" r="3"/></g><text x="426" y="392" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0E9AAB" text-anchor="start">5</text><text x="442" y="392" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#111827" text-anchor="start">Switched to Auto</text><text x="386" y="424" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4B5563" text-anchor="start">It acts when you click, after</text><text x="386" y="443" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4B5563" text-anchor="start">showing exactly what it will do.</text><path d="M656,398 L702,398" stroke="#8A96A3" stroke-width="2" fill="none" marker-end="url(#ah)"/><rect x="708" y="360" width="280" height="180" rx="6" fill="#FFFFFF" stroke="#D9DFE6"/><rect x="708" y="360" width="280" height="5" rx="2" fill="#4FDCEA"/><g transform="translate(724,380) scale(1.1666666666666667)" fill="none" stroke="#0E9AAB" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></g><text x="764" y="392" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0E9AAB" text-anchor="start">6</text><text x="780" y="392" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#111827" text-anchor="start">Later: Watch</text><text x="724" y="424" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4B5563" text-anchor="start">It acts by itself and shows what it</text><text x="724" y="443" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4B5563" text-anchor="start">did, with undo.</text><rect x="1008" y="360" width="280" height="180" rx="6" fill="#FFFFFF" stroke="#E7B4A0"/><g transform="translate(1024,380) scale(1.1666666666666667)" fill="none" stroke="#C2410C" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h8l5 5v8l-5 5H8l-5-5V8z"/><path d="M8.5 12h7"/></g><text x="1064" y="400" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#111827" text-anchor="start">Never on its own</text><text x="1024" y="432" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4B5563" text-anchor="start">Money, prices, credit, new</text><text x="1024" y="451" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4B5563" text-anchor="start">customers or suppliers, people</text><text x="1024" y="470" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4B5563" text-anchor="start">matters and judgment calls always</text><text x="1024" y="489" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4B5563" text-anchor="start">go to a person.</text></svg>
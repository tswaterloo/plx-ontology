<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1100" height="578" viewBox="0 0 1100 578"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A96A3"/></marker></defs><rect width="1100" height="578" rx="8" fill="#F5F7FA"/><text x="32" y="44" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="650" fill="#111827" text-anchor="start">What changed this week</text><rect x="32" y="100" width="1036" height="54" rx="6" fill="#FFFFFF" stroke="#D9DFE6"/><rect x="32" y="100" width="4" height="54" rx="1" fill="#4DA8FF"/><g transform="translate(50,113) scale(1.1666666666666667)" fill="none" stroke="#1F7AE0" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19.5 8.5l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></g><text x="94" y="133" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#111827" text-anchor="start">Ask can do things</text><text x="380" y="133" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="start">&quot;Draft a reply&quot;, &quot;chase this supplier&quot;: drafts land on the approvals desk.</text><rect x="32" y="164" width="1036" height="54" rx="6" fill="#FFFFFF" stroke="#D9DFE6"/><rect x="32" y="164" width="4" height="54" rx="1" fill="#4FDCEA"/><g transform="translate(50,177) scale(1.1666666666666667)" fill="none" stroke="#1F7AE0" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8L16.5 9.5"/></g><text x="94" y="197" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#111827" text-anchor="start">Approvals desk</text><text x="380" y="197" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="start">See exactly what will be sent or changed, then confirm. One at a time.</text><rect x="32" y="228" width="1036" height="54" rx="6" fill="#FFFFFF" stroke="#D9DFE6"/><rect x="32" y="228" width="4" height="54" rx="1" fill="#4DA8FF"/><g transform="translate(50,241) scale(1.1666666666666667)" fill="none" stroke="#1F7AE0" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.5 5.5l1.9 1.9M16.6 16.6l1.9 1.9M5.5 18.5l1.9-1.9M16.6 7.4l1.9-1.9"/></g><text x="94" y="261" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#111827" text-anchor="start">Autopilot studio</text><text x="380" y="261" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="start">Review queue, modes, scores and a builder that replays past days.</text><rect x="32" y="292" width="1036" height="54" rx="6" fill="#FFFFFF" stroke="#D9DFE6"/><rect x="32" y="292" width="4" height="54" rx="1" fill="#4FDCEA"/><g transform="translate(50,305) scale(1.1666666666666667)" fill="none" stroke="#1F7AE0" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></g><text x="94" y="325" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#111827" text-anchor="start">Meetings as a calendar</text><text x="380" y="325" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="start">Agenda or week view, with a prep sheet for each meeting.</text><rect x="32" y="356" width="1036" height="54" rx="6" fill="#FFFFFF" stroke="#D9DFE6"/><rect x="32" y="356" width="4" height="54" rx="1" fill="#4DA8FF"/><g transform="translate(50,369) scale(1.1666666666666667)" fill="none" stroke="#1F7AE0" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></g><text x="94" y="389" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#111827" text-anchor="start">Sources show who cites them</text><text x="380" y="389" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="start">Open an email or record and see every order it relates to.</text><rect x="32" y="420" width="1036" height="54" rx="6" fill="#FFFFFF" stroke="#D9DFE6"/><rect x="32" y="420" width="4" height="54" rx="1" fill="#4FDCEA"/><g transform="translate(50,433) scale(1.1666666666666667)" fill="none" stroke="#1F7AE0" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></g><text x="94" y="453" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#111827" text-anchor="start">View as</text><text x="380" y="453" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="start">The owner can see a colleague&#x27;s work list as they do, read-only.</text><rect x="32" y="484" width="1036" height="54" rx="6" fill="#FFFFFF" stroke="#D9DFE6"/><rect x="32" y="484" width="4" height="54" rx="1" fill="#4DA8FF"/><g transform="translate(50,497) scale(1.1666666666666667)" fill="none" stroke="#1F7AE0" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></g><text x="94" y="517" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#111827" text-anchor="start">Faster pages</text><text x="380" y="517" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="start">Pages open from a store that is kept up to date, with no nightly rebuild.</text></svg>
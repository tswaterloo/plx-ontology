# The Spark hot standby's settings (rendered by standby_install.sh: @HOME@ = the Spark login's
# home). The data folder is a copy of the box's (standby_copy.py), so its postgresql.auto.conf
# (the box's tuning) is read after this file and wins where both set a value; jit is also
# forced off on the command line in plx-spark-standby.service.
data_directory = '@HOME@/plx-ai/pgdata'
hba_file = '@HOME@/plx-ai/standby/pg_hba.conf'
ident_file = '@HOME@/plx-ai/standby/pg_ident.conf'

# Unix socket only, in a folder only the Spark login can open; runs bind it at /run/postgresql.
listen_addresses = ''
port = 5432
unix_socket_directories = '@HOME@/plx-ai/standby-run'
unix_socket_permissions = 0700

# A hot standby refuses to start when any of these is below the primary's value.
max_connections = 200
max_worker_processes = 16
max_wal_senders = 10
max_prepared_transactions = 0
max_locks_per_transaction = 64
max_parallel_workers = 12
max_parallel_workers_per_gather = 4

shared_buffers = 8GB
huge_pages = off
effective_cache_size = 40GB
work_mem = 64MB
maintenance_work_mem = 1GB
temp_file_limit = 10GB
random_page_cost = 1.1
effective_io_concurrency = 200
jit = off
shared_preload_libraries = 'pg_stat_statements'

hot_standby = on
hot_standby_feedback = off
max_standby_streaming_delay = 5min
primary_conninfo = 'host=@HOME@/plx-ai/standby-tun port=5432 user=plx_standby application_name=plx_s7d3d'
primary_slot_name = 'plx_s7d3d'
recovery_target_timeline = 'latest'

# Same as the box, so results and plans read the same.
timezone = 'Etc/UTC'
log_timezone = 'Etc/UTC'
datestyle = 'ISO, MDY'
lc_messages = 'C.UTF-8'
lc_monetary = 'C.UTF-8'
lc_numeric = 'C.UTF-8'
lc_time = 'C.UTF-8'
default_text_search_config = 'pg_catalog.english'
track_io_timing = on

# Logs go to stderr, which the user unit hands to the journal.
logging_collector = off
log_destination = 'stderr'
log_line_prefix = '%m [%p] %q%u@%d '

[Service]
# R-14 (11-12): 51 of 55 failures in 7 days were 30-minute timeouts with under 2 min of CPU: the
# pass peaked at 2.2G against MemoryHigh=2G (swap at its 512M cap), so the kernel throttled it
# to a crawl. Room above its peak, and a timeout that still ends a hung pass.
MemoryHigh=5G
MemoryMax=6G
MemorySwapMax=1G
TimeoutStartSec=60min

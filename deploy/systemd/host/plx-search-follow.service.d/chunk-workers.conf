# Layer-by-layer embedding: 4 chunking workers, 2 embedding workers, stops under 60 GB free.
[Service]
ExecStart=
ExecStart=/data/venv/bin/python3 -m operating.embed follow --mode layers --state /data/plx-state --layer-seconds 600 --chunk-workers 4 --workers 2 --embed-seconds 120 --wait-seconds 300 --min-free-gb 60

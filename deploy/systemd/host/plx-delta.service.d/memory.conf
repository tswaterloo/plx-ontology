[Service]
# One memory setting for the delta (R-13, 11-12): 24G high / 28G max, persistent. It replaces the
# runtime set-property (--runtime, lost on reboot). zz-catchup.conf (14G/16G, the 11-11
# catch-up) out-ranks this file while it exists; it was removed 11-12 after the catch-up published.
MemoryHigh=24G
MemoryMax=28G

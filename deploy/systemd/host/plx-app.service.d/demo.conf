# Demo drop-in for plx-app.service on @PLX_HOSTNAME@ (install as
# /etc/systemd/system/plx-app.service.d/demo.conf). See deploy/README.md, "Demo on @PLX_HOSTNAME@".
# The web app holds no data and no keys; it runs from the current release's build.
# DEMO: as @PLX_USER@, who owns that checkout (follow-up: plx-workbench with an ACL).
[Service]
User=@PLX_USER@
Group=@PLX_GROUP@
WorkingDirectory=@PLX_CURRENT@/app
ReadWritePaths=
ReadWritePaths=@PLX_CURRENT@/app/.next/cache

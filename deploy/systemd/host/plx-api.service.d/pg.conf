[Service]
# Reads are served from Postgres (docs/no-builds.md step 6); zz-pg-only.conf narrows it to
# Postgres only.
Environment=PLX_ONTOLOGY_PG=1
# The traverse facts cache, shared with the delta follower (plx-ontology-pg-follow, its
# default) and the proactive passes.
Environment=PLX_PG_FACTS_DIR=@PLX_HOME@/.cache/plx/pg-facts

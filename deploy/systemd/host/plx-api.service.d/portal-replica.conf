# The Portal read replica for the prepared-writes desk's "record as read" (a Portal edit's
# values before and updated_at): the read-only login from /etc/plx/portal-replica.env, reached
# through plx-portal-replica-tunnel.service (integrations/portal_replica.py). Absent file or
# tunnel: a Portal edit is refused, never shown against the model's word.
[Unit]
Wants=plx-portal-replica-tunnel.service
[Service]
EnvironmentFile=-/etc/plx/portal-replica.env
Environment=PLX_PORTAL_REPLICA_HOSTADDR=127.0.0.1
Environment=PLX_PORTAL_REPLICA_TUNNEL_PORT=15433

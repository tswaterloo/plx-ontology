# ARCH-T6: a stop lets the requests under way end (operator_api/server.py GRACE_SECONDS, 180 s)
# and joins the workers (20 s) before systemd's SIGKILL; mirrored to plx-api@standby by plx-release.
# KillMode=mixed: SIGTERM goes to the API process alone. control-group sent it to the Ask helpers
# (claude) and the worker processes too, so every answer under way failed at every deploy.
[Service]
TimeoutStopSec=210
KillMode=mixed

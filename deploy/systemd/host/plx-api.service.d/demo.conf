# Demo drop-in for plx-api.service on @PLX_HOSTNAME@ (install as
# /etc/systemd/system/plx-api.service.d/demo.conf). See deploy/README.md, "Demo on @PLX_HOSTNAME@".
#
# DEMO ONLY: the API runs as the host owner (@PLX_USER@) in --dev --dev-ticket-login mode over
# the live operator state, from the current release. Why the owner and not
# plx-workbench: the state (/data/plx-state, mode 0700), the Postgres peer role, the keys
# file and the Claude Code login the Ask agent uses all belong to @PLX_USER@; giving a second
# user access to them is the follow-up (README). The console's own runtime writes
# (case-runtime/cases.sqlite, session-replay.sqlite, console-ticket-audit.jsonl) go to the
# state directory exactly as the case host's do; nothing else is written there.
[Service]
User=@PLX_USER@
Group=@PLX_GROUP@
WorkingDirectory=@PLX_CURRENT@
# Keys: read by systemd from the owner's 0600 files; never copied anywhere.
# plx.env: CLAUDE_CODE_OAUTH_TOKEN (the Ask agent's Claude Code login), the Graph/BC
# GET-only reader credentials the console's resolver and case reads use, and
# PLX_EXCLUDED_PEOPLE_OIDS (fail-closed people exclusion).
# workbench-session.env: PLX_WORKBENCH_SESSION_SECRET (signs the demo access tickets).
EnvironmentFile=@PLX_HOME@/.config/plx/plx.env
EnvironmentFile=@PLX_HOME@/.config/plx/workbench-session.env
# Not needed by the API: dropped from its environment.
UnsetEnvironment=PLX_WORKBENCH_API_KEY MC_MCP_API_KEY MC_MCP_PRINCIPAL_ID MC_BASE_URL MC_OPERATOR_EMAIL OPENAI_API_KEY AZURE_STORAGE_KEY AZURE_STORAGE_ACCOUNT AZURE_DOC_INTEL_KEY AZURE_DOC_INTEL_ENDPOINT PLX_EVAL_READER PLX_EVAL_HELD_OUT_DIR ANTHROPIC_API_KEY
Environment=HOME=@PLX_HOME@
Environment=PATH=/data/venv/bin:@PLX_HOME@/.local/bin:/usr/bin:/bin
ExecStart=
ExecStart=/data/venv/bin/python3 -m operator_api serve --bind 127.0.0.1 --port 8780 $PLX_API_ARGS
# The base unit's sandbox assumes the plx-workbench user and a private state directory.
# Here the console writes its runtime into /data/plx-state and the Ask agent (claude CLI)
# writes its session files under ~/.claude, so: /usr, /boot and /etc stay read-only, the
# rest of the base hardening stays.
StateDirectory=
ReadWritePaths=
ProtectSystem=full
ProtectHome=no
Nice=5

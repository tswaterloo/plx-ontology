# The Ask's reads (plx.sql, plx.search, plx.open) run on the Spark hot standby, never on the
# box's primary (A heavy read is protected against by where it runs, not
# by a limit). ``operating.standby_route`` uses this DSN while the standby answers as a replica
# (every result says where it was read and as of when); the primary otherwise, said. The
# warm-up reads it too (``operator_api.standby_reads``). The standby never cancels a read
# (max_standby_streaming_delay = -1, set live).
# Role plx_api on this socket reads the standby (it showed
# max_standby_streaming_delay through it from the box). A systemd drop-in's Environment applies
# beside /etc/plx/workbench-api.env.
[Service]
Environment=PLX_WARM_STANDBY_DSN=postgresql:///plx?host=/run/plx-standby-pg&user=plx_api

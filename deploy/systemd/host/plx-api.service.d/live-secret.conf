# Live-session drop-in for plx-api.service (install as
# /etc/systemd/system/plx-api.service.d/live-secret.conf). It names the env file only;
# the file itself (root-owned, mode 0600, outside every checkout) holds the secrets and is
# never committed, rendered or printed. The file is required: without it the API refuses to
# start, so it can never sign sessions with a development secret from another env file.
[Service]
EnvironmentFile=/etc/plx/live-session.env

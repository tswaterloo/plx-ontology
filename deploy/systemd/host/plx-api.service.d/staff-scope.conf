# Staff read scope (operating/
# staff_scope.py). Sensitive SharePoint sites keep their per-file permission check for staff
# (full readers and the finance/exec holders of those files still read them); every other
# site's files open to all staff. Site names are the /sites/<name>/ segment of the URL.
# Unset (or no valid entry): every site keeps its per-file check.
# PLX_RESTRICTED_SHARED_MAILBOXES: shared mailboxes kept from staff (ids or addresses).
# PLX_SHARED_MAILBOX_ALLOW: mailbox object ids once recorded as a person's that may read as
# shared again (unset: none). Folder entries <site>/<folder> are accepted in the site list;
# pay, HR and confidential paths and files narrower than their site's permissions keep
# their per-file check on every site. The drive ids (b!...) are those sites' libraries as
# captured 2026-11-17, so a renamed site keeps its restriction.
[Service]

# AUDIT3-06: answers and drafts go through the full humanize pass (operating/humanize.py):
# check, deterministic repair, then one delete-only model rewrite when a strong tic or a
# cluster is still there. The model is the one the Ask already runs (`claude -p` on the
# operator's login, haiku, no tools; counted in PLX_MODEL_LEDGER) until a company key
# exists; a rewrite that adds, moves or loses a fact is discarded (`confined`, `preserved`).
# Undo: delete this file (the default is `repair`, no model call).
[Service]
Environment=PLX_HUMANIZE=rewrite

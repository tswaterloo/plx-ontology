# Demo drop-in for plx-caddy.service on @PLX_HOSTNAME@ (install as
# /etc/systemd/system/plx-caddy.service.d/demo.conf). Caddy stays the unprivileged caddy
# user; only the Caddyfile path changes to the current release. Its certificate
# for the *.ts.net name comes from tailscaled (TS_PERMIT_CERT_UID=caddy).
[Service]
ExecStart=
ExecStart=/usr/bin/caddy run --config @PLX_CURRENT@/deploy/Caddyfile --adapter caddyfile
ExecReload=
ExecReload=/usr/bin/caddy reload --config @PLX_CURRENT@/deploy/Caddyfile --adapter caddyfile --force

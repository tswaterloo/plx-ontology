[Service]
# At most one truth check per 30 minutes: its triggers fire 2-6 times an hour with identical
# output. Percent and dollar are escaped for systemd (unescaped, every run was skipped).
ExecCondition=
ExecCondition=/bin/sh -c 'f=/data/plx-state/truth-check/report.md; [ ! -f $$f ] || [ $$(( $$(date +%%s) - $$(stat -c %%Y $$f) )) -gt 1800 ]'

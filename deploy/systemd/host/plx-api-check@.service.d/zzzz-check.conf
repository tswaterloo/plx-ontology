# Read last, after the API's own drop-ins (render.py and install.py install every
# plx-api.service.d drop-in for plx-api-check@.service too): the check runs the candidate
# release, once, and never restarts.
[Service]
Type=oneshot
Restart=no
WorkingDirectory=@PLX_RELEASES@/%i
ExecStart=
ExecStart=/usr/bin/env python3 -m operator_api serve --check --bind 127.0.0.1 --port 8780 $PLX_API_ARGS

[Service]
# R-11: the follower as a unit (it ran as a systemd-run loop that a reboot lost), with
# the loop's settings: 8 workers (14 left 1 GB free), no builds, text chunks deferred.
# resume: never: business rule, no more full rebuilds; schema/data changes apply in place or via Spark trains
Environment=PLX_BUILDS_OFF=1
Environment=PLX_ONTOLOGY_DEFER=text_chunks
ExecStart=
ExecStart=/data/venv/bin/python3 -m operating.pg.ontology_delta --follow /data/plx-state --min-free-gb 150 --workers 8

[Service]
# Never replace the backup with a near-empty re-created mail store
# (deploy/backup/backup_size_guard.sh, installed next to capture_backup.py: sudo install -D -m 0755 deploy/backup/backup_size_guard.sh /usr/local/lib/plx/backup_size_guard.sh).
ExecCondition=/usr/local/lib/plx/backup_size_guard.sh

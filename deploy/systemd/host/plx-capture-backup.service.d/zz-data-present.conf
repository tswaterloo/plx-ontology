[Service]
# Never back up an empty or missing /data over the good copy.
ExecCondition=/usr/bin/mountpoint -q /data
ExecCondition=/usr/bin/test -s /data/plx-state/mail-capture/capture.db
ExecCondition=/usr/bin/test -s /data/plx-state/teams-capture/capture.db
ExecCondition=/usr/bin/test -s /data/plx-state/bc-capture/capture.sqlite

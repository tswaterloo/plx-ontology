# CC-P-04 / REL-R-14: fewer link-scan threads (every core reading ~16 result sets at once was
# the memory behind the OOM kills) and a 10 minute budget for one detector statement (the
# shared 120 s cut vendor_no_reply, teams_unanswered_ask and price_consistency every pass).
[Service]
Environment=PLX_PROACTIVE_SCAN_THREADS=6
Environment=PLX_PROACTIVE_STATEMENT_SECONDS=600

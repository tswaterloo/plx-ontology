# The API's own-user trial (deploy/release/README-api-user.md step 4): the live unit's drop-ins
# plus zz-api-user.conf, on 8792, signing with the development secret (live-secret.conf is not
# copied), no live send, its own app data. deploy/pg/role_walk.py --api-url walks it.
[Unit]
Description=PLX Workbench API trial as the API's own user (not for staff)
[Service]
UnsetEnvironment=PLX_ACTIONS_LIVE PLX_ACTIONS_SENDERS PLX_ACTIONS_GRAPH_CREDENTIALS
Restart=no
ExecStart=
ExecStart=/data/venv/bin/python3 -m operator_api serve --bind 127.0.0.1 --port 8792 --dev --dev-ticket-login --insecure-cookie --state-dir /data/plx-state --host-config @PLX_HOME@/.config/plx/workbench-host-vince/host.json --ask --ask-workers 1 --pg-dsn postgresql:///plx --app-data-dir /var/lib/plx-workbench/trial-app-data

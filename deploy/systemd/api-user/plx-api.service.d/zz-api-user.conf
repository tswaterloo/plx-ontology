# SEC-S-07 / S-12: the API as its own user from a sealed release (deploy/release/README-api-user.md).
# Installed beside the host drop-ins; "zz" sorts last, so it overrides demo.conf's owner account.
# Rendered only with `render.py --api-user`: switching the API's user is its own step.
#
# Reads: CAP_DAC_READ_SEARCH lets the API read the stores the jobs write as @PLX_USER@ (0600 files),
# but only what this mount namespace shows: the owner's home is an empty tmpfs except the host
# config and the facts cache bound read-only; agents' worktrees, scratch copies and backups are
# not there at all. Writes: only where the API's own user may write (DAC) inside ReadWritePaths:
# its state directory and the shared-write set of /data/plx-state (group plx-state, sticky
# state root: it creates its own files and changes no one else's). The code (the sealed release)
# and every capture store are read-only to it.
[Service]
User=plx-workbench
Group=plx-workbench
SupplementaryGroups=plx-state
UMask=0007
WorkingDirectory=@PLX_CURRENT@
# the Ask agent's Claude Code login (CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`), root 0600
EnvironmentFile=/etc/plx/api-model.env
Environment=HOME=/var/lib/plx-workbench
Environment=PATH=/data/venv/bin:/usr/local/bin:/usr/bin:/bin
Environment=DISABLE_AUTOUPDATER=1
StateDirectory=plx-workbench
StateDirectoryMode=0700
AmbientCapabilities=CAP_DAC_READ_SEARCH
CapabilityBoundingSet=CAP_DAC_READ_SEARCH
NoNewPrivileges=true
ProtectSystem=strict
ProtectHome=tmpfs
BindReadOnlyPaths=@PLX_HOME@/.config/plx/workbench-host-vince
BindReadOnlyPaths=-@PLX_HOME@/.cache/plx/pg-facts
ReadWritePaths=/data/plx-state
# the read capability must not reach past the stores: no worktree, scratch copy or backup, no
# Postgres data files (the role's grants are the API's database rights), no host secrets
InaccessiblePaths=-/data/scratch -/data/backups -/data/OntologyProject -/data/pg -/var/lib/postgresql
InaccessiblePaths=-/etc/shadow -/etc/gshadow -/etc/ssh -/etc/sudoers -/etc/sudoers.d -/var/log -/root
# (file by file, not /etc/plx: in Entra mode the API reads /etc/plx/entra-resource.json; a new
# root-only file there must be added here)
InaccessiblePaths=-/etc/plx/live-session.env -/etc/plx/api-model.env -/etc/plx/mint-readers.env
# the read capability opens files by handle too (open_by_handle_at), past every mount above:
# the API never needs it
SystemCallFilter=~open_by_handle_at name_to_handle_at
SystemCallErrorNumber=EPERM
PrivateTmp=true
PrivateDevices=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectControlGroups=true
ProtectClock=true
RestrictSUIDSGID=true
LockPersonality=true
RestrictNamespaces=true
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX

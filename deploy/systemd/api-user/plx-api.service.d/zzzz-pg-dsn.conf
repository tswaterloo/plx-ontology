# The API's Postgres role in its DSN as well as in PGUSER (zy-pg-role.conf).
# The per-Ask tools host (operating.agent_session) gets PLX_PG_DSN from the API's environment;
# before PGUSER was on its allowlist (STORE_ENV) a host with a user-less DSN connected as its
# OS user (plx-workbench), which Postgres refuses, and every Ask read failed. An env file
# overrides Environment=, and plx.env / workbench-api.env set a user-less DSN, so the role's
# DSN comes from an env file loaded after them. It holds no secret (peer auth):
#   printf 'PLX_PG_DSN=postgresql://plx_api@/plx\n' | sudo tee /etc/plx/api-pg-dsn.env
[Service]
EnvironmentFile=-/etc/plx/api-pg-dsn.env

# SEC-S-13: every Postgres session of the API and its children logs in as plx_api (libpq reads
# PGUSER when the DSN names no user; PLX_PG_DSN is postgresql:///plx). Needs the pg_ident map
# (deploy/release/README-api-user.md step 1). Rollback: remove this file, restart plx-api.
[Service]
Environment=PGUSER=plx_api

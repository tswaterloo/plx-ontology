<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>PLX Workbench</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
  <script src="/workspace.js" defer></script>
  <script src="/workspace_actions.js" defer></script>
  <script src="/link_confirm.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="rail" aria-label="Main navigation">
      <div class="brand"><div class="brand-mark">P<span>✦</span></div><div><strong>PLX</strong><small>AGENT WORKBENCH</small></div></div>
      <div class="rail-caption">WORKSPACE</div>
      <nav id="navigation">
        <button class="nav-item selected" data-view="home"><span class="nav-icon">⌂</span><span>Home</span></button>
        <button class="nav-item" data-view="objects"><span class="nav-icon">⌕</span><span>Find &amp; open</span></button>
        <button class="nav-item" data-view="cases"><span class="nav-icon">▤</span><span>Cases</span><span class="nav-count" id="case-count">0</span></button>
      </nav>
      <div class="rail-bottom"><div class="mode-dot"></div><div><strong>Local workbench</strong><small>Read-only · every value cited</small></div></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="breadcrumbs"><span>PLX</span><span class="crumb-sep">/</span><span id="view-crumb">Home</span></div>
        <div class="top-actions"><span class="top-status"><span class="live-dot"></span> <span id="session-status">Local service</span><span class="session-role" id="session-role"></span></span><button id="refresh" class="button subtle" type="button">↻ <span>Refresh</span></button></div>
      </header>
      <div class="content">
        <div class="eyebrow"><span class="line"></span> PLX WORKBENCH <span id="updated-at"></span></div>
        <div class="page-heading"><div><h1 id="page-title">Ask about any transaction.</h1><p id="page-subtitle">Start from a question or an identifier, open the record, and read its evidence, each value cited.</p></div></div>
        <div id="notice" role="status" aria-live="polite"></div>
        <section id="view" aria-live="polite"></section>
      </div>
    </main>
    <aside id="detail" class="detail hidden" aria-label="Detail panel"><div class="detail-header"><div class="detail-navigation"><button id="back-detail" type="button" hidden aria-label="Back to previous workspace">← Back</button><span>INSPECTOR</span></div><button id="close-detail" type="button" aria-label="Close detail">×</button></div><div id="detail-body"></div></aside>
  </div>
</body>
</html>
